<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cinéma Édition - Moteur de recherche Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --surface-color: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a1a1a6;
            --accent: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.3);
            --modal-bg: rgba(10, 10, 12, 0.95);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e 0%, var(--bg-color) 80%);
            background-attachment: fixed;
            color: var(--text-primary); 
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 40px 25px; 
        }

        header { text-align: center; margin-bottom: 60px; pointer-events: none; }
        
        h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 4.5rem; 
            color: #fff; 
            font-weight: 600;
            letter-spacing: -2px;
            margin-bottom: 5px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        h1 span { color: var(--accent); font-style: italic; font-weight: 400; }
        .subtitle { 
            color: var(--text-secondary); 
            font-size: 0.9rem; 
            font-weight: 400; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            opacity: 0.7;
        }

        /* Barre de recherche Minimalist faon flim.ai */
        .search-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .search-box { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 8px 15px; 
            border-radius: 100px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            width: 100%;
            max-width: 700px;
            gap: 10px; 
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        
        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            transform: scale(1.02);
        }

        .search-box input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 1.2rem; 
            padding: 15px 25px;
            width: 100%;
            outline: none;
        }

        .search-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50px;
            padding: 0 40px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .search-btn:active { transform: scale(0.95); }

        /* Chips Filtres */
        .filter-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-secondary);
        }
        .chip:hover, .chip.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* Masonry Grid */
        .results { 
            column-count: 4;
            column-gap: 25px;
            width: 100%;
        }

        @media (max-width: 1200px) { .results { column-count: 3; } }
        @media (max-width: 900px) { .results { column-count: 2; } }
        @media (max-width: 600px) { .results { column-count: 1; } }

        .movie-card { 
            break-inside: avoid;
            margin-bottom: 25px;
            background: var(--surface-color); 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Fallback Visual - Backdrop Artistique */
        .card-visual {
            width: 100%;
            height: 240px;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        
        .card-visual::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.8) 100%);
        }

        .card-content { padding: 20px; position: relative; }
        .card-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
        .card-meta { font-size: 0.75rem; color: var(--accent); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

        /* Modal Cinematic faon Allocin */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-container {
            width: 100%;
            max-width: 1100px;
            background: var(--modal-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            display: flex;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            position: relative;
            max-height: 90vh;
        }

        .modal-sidebar {
            flex: 0 0 380px;
            position: relative;
            background: #111;
        }

        .modal-main {
            flex: 1;
            padding: 60px;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.3s;
        }
        .close-btn:hover { background: #ff4545; }

        .modal-title { font-family: 'Playfair Display', serif; font-size: 3.5rem; line-height: 1; margin-bottom: 30px; color: #fff; }
        .modal-stats { display: flex; gap: 40px; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 30px; }
        .stat-item { display: flex; flex-direction: column; gap: 5px; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 2px; }
        .stat-value { font-size: 1.4rem; color: var(--accent); font-weight: 500; }

        .modal-overview { color: var(--text-secondary); font-size: 1.2rem; font-weight: 300; line-height: 1.8; margin-bottom: 40px; }

        /* Pagination faon Flim */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 60px;
            gap: 15px;
        }
        .pagination-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 30px;
            border-radius: 100px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .pagination-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .pagination-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Custom Scrollbar */
        .modal-main::-webkit-scrollbar { width: 6px; }
        .modal-main::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container" id="mainView">
        <header>
            <h1>Cinéma <span>Édition</span></h1>
            <div class="subtitle">Search Engine & Discovery</div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="query" placeholder="Saisissez un titre, un genre ou un acteur..." onkeypress="handleEnter(event)">
                <button class="search-btn" onclick="executeSearch()">Chercher</button>
            </div>
            
            <div class="filter-chips">
                <div class="chip active" onclick="setLang('', this)">Tous</div>
                <div class="chip" onclick="setLang('fr', this)">Français</div>
                <div class="chip" onclick="setLang('en', this)">Anglais</div>
                <div class="chip" onclick="setLang('ja', this)">Japonais</div>
                <div class="chip" onclick="setLang('ko', this)">Coréen</div>
                <div class="chip" onclick="setLang('es', this)">Espagnol</div>
            </div>
        </div>
        
        <div id="stats" style="text-align: center; color: var(--text-secondary); margin-bottom: 20px; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;"></div>
        <div id="results" class="results"></div>
        
        <div class="pagination-container" id="pagination" style="display: none;">
            <button id="prevBtn" class="pagination-btn" onclick="changePage(-1)">Précédent</button>
            <button id="nextBtn" class="pagination-btn" onclick="changePage(1)">Suivant</button>
        </div>
    </div>

    <!-- Modal Detail Overlay -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalExtern(event)">
        <div class="modal-container">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-sidebar" id="modalSidebar"></div>
            <div class="modal-main">
                <div class="modal-title" id="mTitle"></div>
                <div class="modal-stats">
                    <div class="stat-item">
                        <span class="stat-label">Note Public</span>
                        <span class="stat-value" id="mRating"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Sortie</span>
                        <span class="stat-value" id="mDate"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Langue</span>
                        <span class="stat-value" id="mLang"></span>
                    </div>
                </div>
                <div class="modal-overview" id="mOverview"></div>
                
                <div style="display: flex; gap: 15px;">
                    <button class="search-btn" style="background:#fff; font-size: 0.8rem;" onclick="alert('Indisponible : Pas de lien VOD')">Regarder le Trailer</button>
                    <button class="search-btn" style="background:transparent; border: 1px solid var(--border-color); color:#fff; font-size: 0.8rem;" onclick="closeModal()">Retour</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let selectedLang = '';
        let currentResults = [];
        const PAGE_SIZE = 16;

        function setLang(lang, el) {
            selectedLang = lang;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            executeSearch();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function executeSearch() {
            currentPage = 0; 
            searchMovies();
        }

        function changePage(direction) {
            currentPage += direction;
            searchMovies();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Gnre un dgrad artistique unique bas sur le nom/ID
        function generateBackdrop(id) {
            const h = (id * 137) % 360;
            return `linear-gradient(135deg, hsl(${h}, 40%, 20%), hsl(${(h+60)%360}, 40%, 10%))`;
        }

        async function searchMovies() {
            const query = document.getElementById('query').value;
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            
            let esQuery = {
                "from": currentPage * PAGE_SIZE,
                "size": PAGE_SIZE,
                "query": { "bool": { "must": [] } }
            };

            if (query) {
                esQuery.query.bool.must.push({
                    "multi_match": {
                        "query": query,
                        "fields": ["title^5", "overview"],
                        "fuzziness": "AUTO"
                    }
                });
            } else {
                esQuery.query.bool.must.push({ "match_all": {} });
            }

            if (selectedLang) {
                esQuery.query.bool.filter = [{ "term": { "original_language": selectedLang } }];
            }

            try {
                const response = await fetch('http://localhost:9200/movies_clean/_search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(esQuery)
                });
                
                const data = await response.json();
                resultsDiv.innerHTML = '';
                currentResults = data.hits.hits;

                const totalHits = data.hits.total.value;
                if (currentResults.length > 0) {
                    statsDiv.innerHTML = `${totalHits.toLocaleString('fr-FR')} RÉFÉRENCES DISPONIBLES`;
                    
                    currentResults.forEach((hit, index) => {
                        const movie = hit._source;
                        const backdrop = generateBackdrop(movie.movie_id || index);
                        
                        resultsDiv.innerHTML += `
                            <div class="movie-card" onclick="openDetails(${index})">
                                <div class="card-visual" style="background: ${backdrop}"></div>
                                <div class="card-content">
                                    <div class="card-meta">${movie.original_language.toUpperCase()} • ${movie.vote_average.toFixed(1)} ⭐</div>
                                    <div class="card-title">${movie.title}</div>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('pagination').style.display = 'flex';
                    document.getElementById('prevBtn').disabled = (currentPage === 0);
                    document.getElementById('nextBtn').disabled = ((currentPage + 1) * PAGE_SIZE >= totalHits);
                } else {
                    statsDiv.innerHTML = 'Aucun résultat';
                    resultsDiv.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 100px; color: var(--text-secondary);">Aucun film ne correspond à votre recherche élégante.</div>';
                    document.getElementById('pagination').style.display = 'none';
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div style="grid-column: 1/-1; color: #ff5b5b; text-align:center;">Infrastructure indisponible : ${error}</div>`;
            }
        }

        function openDetails(index) {
            const movie = currentResults[index]._source;
            const overlay = document.getElementById('modalOverlay');
            
            document.getElementById('mTitle').innerText = movie.title;
            document.getElementById('mOverview').innerText = movie.overview || "Synopsis non disponible.";
            document.getElementById('mRating').innerText = (movie.vote_average || 0).toFixed(1) + " / 10";
            document.getElementById('mDate').innerText = movie.release_date_ts ? movie.release_date_ts.split('T')[0] : '—';
            document.getElementById('mLang').innerText = movie.original_language.toUpperCase();
            
            // Applique le backdrop artistqiue  la sidebar
            document.getElementById('modalSidebar').style.background = generateBackdrop(movie.movie_id || index);

            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 400);
        }

        function closeModalExtern(e) {
            if (e.target.id === 'modalOverlay') closeModal();
        }

        searchMovies();
    </script>
</body>
</html>
