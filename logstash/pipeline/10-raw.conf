# Pipeline RAW : lit movies.csv et indexe tel quel dans movies_raw
# Objectif : conserver une trace des donnees brutes avant nettoyage

input {
  file {
    path => "/data/movies.csv"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash_movies_raw.sincedb"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/logs/raw_done.log"
  }
}

filter {
  csv {
    separator => ","
    quote_char => "\""
    skip_header => true
    # Colonnes du dataset TMDB (a adapter si autre dataset)
    columns => [
      "id","title","genres","original_language","overview","popularity",
      "production_companies","release_date","budget","revenue","runtime",
      "status","tagline","vote_average","vote_count","credits","keywords",
      "poster_path","backdrop_path","recommendations"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "movies_raw"
  }
}
