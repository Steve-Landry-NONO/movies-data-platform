input {
  file {
    path => "/data/*TMDB*.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  # Suppression de l'en-tête potentiel du CSV
  if [message] =~ /^"index","title","/ {
    drop { }
  }

  csv {
    separator => ","
    quote_char => '"'
    columns => ["movie_id", "title", "original_language", "release_date", "popularity", "vote_average", "vote_count", "overview"]
  }

  # Index cible par défaut
  mutate {
    add_field => { "[@metadata][target_index]" => "movies_raw" }
  }

  # Clonage de l'événement pour nettoyage
  clone {
    clones => ["clean_event"]
  }

  if "clean_event" in [tags] {
    mutate {
      # Changement de l'index de destination
      replace => { "[@metadata][target_index]" => "movies_clean" }
      
      # Conversions de type documentées pour movies_clean
      convert => {
        "movie_id" => "integer"
        "popularity" => "float"
        "vote_average" => "float"
        "vote_count" => "integer"
      }
    }

    # Format de date observé (ex: 31-05-2023 pour Spider-Man: Across the Spider-Verse)
    date {
      match => ["release_date", "dd-MM-yyyy", "yyyy-MM-dd"]
      target => "release_date_ts"
    }

    # Nettoyage des champs inutiles
    mutate {
      remove_field => ["type", "@version", "host", "path"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }

  # Pour débug local, décommentez la ligne ci-dessous si besoin
  # stdout { codec => rubydebug }
}
